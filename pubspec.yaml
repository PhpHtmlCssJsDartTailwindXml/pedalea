name: pedalea
description: "Pedalea: ciclovías de la Región Metropolitana."
publish_to: 'none'
version: 1.4.3+43

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
    
  
  # Mapas y ubicación
  mapbox_maps_flutter: ^2.20.0
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  geolocator: ^10.1.0
  flutter_compass: ^0.8.1
  crypto: ^3.0.3
  permission_handler: ^11.0.1
  http: ^1.6.0
  image_picker: ^1.1.2
  
  # Caché persistente y conectividad
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

  # Sensores (detección de caídas) y notificaciones locales (alertas push)
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Compartir resumen como imagen (redes sociales)
  share_plus: ^10.1.4
  path_provider: ^2.1.4

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  android_intent_plus: ^5.2.0

  # Actualización obligatoria desde Play Store (in-app update)
  in_app_update: ^4.2.3
  record: ^6.2.1
  audioplayers: ^6.7.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  in_app_review: ^2.0.12
  gal: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/pedalea_icon_master.png"
  adaptive_icon_background: "#13233F"
  adaptive_icon_foreground: "assets/icon/pedalea_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/pedalea_icon_master.png"
    background_color: "#13233F"
    theme_color: "#13233F"
  windows:
    generate: true
    image_path: "assets/icon/pedalea_icon_master.png"
  macos:
    generate: true
    image_path: "assets/icon/pedalea_icon_master.png"

flutter_native_splash:
  color: "#13233F"
  image: assets/branding/pedalea-icono-fondo-oscuro.png
  android_12:
    # Android 12+ dibuja el ícono dentro de un círculo; necesita más margen
    # que la versión "full bleed" para no verse recortado/gigante.
    image: assets/icon/pedalea_icon_foreground.png
    icon_background_color: "#13233F"
    color: "#13233F"

flutter:
  uses-material-design: true

  # 🔥 ASSETS
  assets:
    - assets/icono_ciclista.png
    - assets/icons/gps_puck.png
    - assets/icons/gps_puck_top.png
    - assets/icons/gps_puck_bearing.png
    - assets/icons/gps_puck_arrow.png
    - assets/icons/gps_puck_empty.png
    - assets/icons/gps_puck_bearing_test.png
    - assets/brands/copec.png
    - assets/branding/pedalea-icono.png
    - assets/branding/pedalea-icono-fondo-oscuro.png
    - assets/branding/pedalea-wordmark.png
    - assets/branding/pedalea-lockup.png
    - assets/branding/pedalea-ciclovia-foto.png
    - assets/branding/google_logo.svg
    - logos/pedalea-login-bg-camino2.png
    - logos/pedalea-icon-login-176.png
    - assets/carousel/
    - assets/data/ciclorecreovia.json
    - assets/data/ciclovias_chile.json
    - assets/data/bike_services_chile.json
    - assets/data/bike_parkings_chile.json

  # 🔥 FUENTES - POPPINS
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 400
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 700
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 800